<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>元欣-請購／維修</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
  :root{
    --black:#111111;--white:#FAFAF8;--gray-100:#F2F1EE;
    --gray-200:#E0DED9;--gray-400:#A8A49D;--gray-600:#6B6760;
    --orange:#E8561F;--orange-light:#FEF0EA;
    --blue:#1A5FBF;--blue-light:#EAF0FB;
    --green:#1A7F5A;--green-light:#EAF7F1;
    --red:#C0392B;--red-light:#FDEEEC;
    --radius:14px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--gray-100);color:var(--black);min-height:100vh;max-width:480px;margin:0 auto;}

  /* LOGIN */
  .login-screen{min-height:100vh;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center;}
  .brand-dot{width:48px;height:48px;border-radius:50%;background:var(--orange);margin:0 auto 24px;}
  .login-title{color:var(--white);font-size:22px;font-weight:700;margin-bottom:8px;}
  .login-sub{color:var(--gray-400);font-size:14px;margin-bottom:40px;}
  .google-btn{display:inline-flex;align-items:center;gap:10px;background:var(--white);color:var(--black);border:none;border-radius:var(--radius);padding:14px 24px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}

  /* HEADER */
  .app-header{background:var(--black);padding:52px 24px 24px;}
  .header-brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
  .header-dot{width:28px;height:28px;border-radius:50%;background:var(--orange);}
  .header-brand-name{color:var(--white);font-size:14px;font-weight:500;}
  .header-title{color:var(--white);font-size:26px;font-weight:700;margin-bottom:6px;}
  .header-sub{color:var(--gray-400);font-size:13px;}

  /* TYPE SELECT */
  .type-select{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:20px 16px 0;}
  .type-btn{padding:16px 12px;border-radius:var(--radius);border:2px solid var(--gray-200);background:var(--white);text-align:left;cursor:pointer;transition:all 0.18s;font-family:inherit;}
  .type-btn:active{transform:scale(0.97);}
  .type-btn.selected-purchase{background:var(--blue-light);border-color:var(--blue);}
  .type-btn.selected-repair{background:var(--orange-light);border-color:var(--orange);}
  .type-btn-icon{font-size:22px;margin-bottom:6px;}
  .type-btn-label{font-size:14px;font-weight:700;color:var(--black);}
  .type-btn-sub{font-size:11px;color:var(--gray-600);margin-top:2px;}

  /* FORM */
  .form-body{padding:16px;}
  .form-card{background:var(--white);border-radius:var(--radius);padding:20px;margin-bottom:12px;}
  .form-section-title{font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--gray-400);text-transform:uppercase;margin-bottom:14px;}
  .form-row{margin-bottom:14px;}
  .form-row:last-child{margin-bottom:0;}
  .form-label{font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:6px;display:flex;align-items:center;gap:4px;}
  .required{color:var(--red);}
  .form-input,.form-select,.form-textarea{width:100%;padding:12px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--gray-100);color:var(--black);outline:none;transition:border-color 0.18s;}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--orange);background:var(--white);}
  .form-textarea{resize:none;height:80px;}
  .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* URGENT TOGGLE */
  .urgent-toggle{display:flex;gap:8px;}
  .urgent-btn{flex:1;padding:11px;border-radius:var(--radius-sm);border:1.5px solid var(--gray-200);background:var(--white);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.18s;color:var(--gray-600);}
  .urgent-btn.selected-yes{background:var(--red);border-color:var(--red);color:var(--white);}
  .urgent-btn.selected-no{background:var(--gray-100);border-color:var(--gray-200);color:var(--gray-600);}

  /* PHOTO UPLOAD */
  .photo-upload-area{border:2px dashed var(--gray-200);border-radius:var(--radius-sm);padding:20px;text-align:center;cursor:pointer;transition:all 0.18s;background:var(--gray-100);}
  .photo-upload-area:active{background:var(--gray-200);}
  .photo-upload-area.has-photo{border-color:var(--green);background:var(--green-light);}
  .photo-upload-icon{font-size:28px;margin-bottom:6px;}
  .photo-upload-label{font-size:13px;font-weight:700;color:var(--gray-600);}
  .photo-upload-sub{font-size:11px;color:var(--gray-400);margin-top:2px;}
  .photo-preview-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .photo-preview-item{position:relative;width:80px;height:80px;}
  .photo-preview-img{width:80px;height:80px;object-fit:cover;border-radius:var(--radius-sm);}
  .photo-preview-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:var(--white);border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

  /* SUBMIT */
  .submit-bar{padding:16px 16px 40px;}
  .submit-btn{width:100%;padding:18px;background:var(--black);color:var(--white);border:none;border-radius:var(--radius);font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.18s;}
  .submit-btn:disabled{background:var(--gray-200);color:var(--gray-400);cursor:not-allowed;}
  .submit-btn:not(:disabled):active{transform:scale(0.98);}

  /* DONE */
  .done-screen{min-height:100vh;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center;}
  .done-circle{width:80px;height:80px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px;animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1);}
  @keyframes pop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
  .done-title{color:var(--white);font-size:24px;font-weight:700;margin-bottom:10px;}
  .done-sub{color:var(--gray-400);font-size:14px;line-height:1.6;margin-bottom:40px;}
  .done-back-btn{background:var(--white);color:var(--black);border:none;border-radius:var(--radius);padding:14px 40px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}

  /* TOAST */
  .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--black);color:var(--white);padding:12px 24px;border-radius:100px;font-size:13px;font-weight:500;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);z-index:999;white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="login-screen">
  <div class="brand-dot"></div>
  <div class="login-title">請購／維修申請</div>
  <div class="login-sub">請先登入 Google 帳號</div>
  <button class="google-btn" onclick="requestLogin()">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    使用 Google 帳號登入
  </button>
</div>

<!-- FORM -->
<div id="screen-form" style="display:none;">
  <div class="app-header">
    <div class="header-brand">
      <div class="header-dot"></div>
      <span class="header-brand-name">元欣</span>
    </div>
    <div class="header-title">請購／維修申請</div>
    <div class="header-sub" id="header-user-info">選擇申請類型</div>
  </div>

  <div class="type-select">
    <button class="type-btn" id="btn-purchase" onclick="selectType('purchase')">
      <div class="type-btn-icon">🛒</div>
      <div class="type-btn-label">請購</div>
      <div class="type-btn-sub">食材・零件・耗材・設備</div>
    </button>
    <button class="type-btn" id="btn-repair" onclick="selectType('repair')">
      <div class="type-btn-icon">🔧</div>
      <div class="type-btn-label">維修</div>
      <div class="type-btn-sub">設備・設施故障</div>
    </button>
  </div>

  <div class="form-body" id="form-body" style="display:none;">
    <div class="form-card">
      <div class="form-section-title">基本資訊</div>
      <div class="form-row-2">
        <div class="form-row">
          <div class="form-label">部門 <span class="required">*</span></div>
          <select class="form-select" id="field-dept" onchange="checkReady()">
            <option value="">請選擇</option>
            <option>生產部</option>
            <option>甜點部</option>
            <option>倉儲/總務/司機</option>
            <option>採購部</option>
            <option>總部</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-label">姓名 <span class="required">*</span></div>
          <input class="form-input" id="field-name" type="text" placeholder="您的姓名" oninput="checkReady()">
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">日期 <span class="required">*</span></div>
        <input class="form-input" id="field-date" type="date" oninput="checkReady()">
      </div>
      <div class="form-row">
        <div class="form-label">是否緊急 <span class="required">*</span></div>
        <div class="urgent-toggle">
          <button class="urgent-btn" id="urgent-yes" onclick="selectUrgent(true)">🔴 緊急</button>
          <button class="urgent-btn selected-no" id="urgent-no" onclick="selectUrgent(false)">一般</button>
        </div>
      </div>
    </div>

    <!-- 請購欄位 -->
    <div class="form-card" id="purchase-fields" style="display:none;">
      <div class="form-section-title">請購資訊</div>
      <div class="form-row">
        <div class="form-label">產品名稱 <span class="required">*</span></div>
        <input class="form-input" id="field-product" type="text" placeholder="例：濾網" oninput="checkReady()">
      </div>
      <div class="form-row-2">
        <div class="form-row">
          <div class="form-label">規格</div>
          <input class="form-input" id="field-spec" type="text" placeholder="例：30x30cm">
        </div>
        <div class="form-row">
          <div class="form-label">數量 <span class="required">*</span></div>
          <input class="form-input" id="field-qty" type="number" placeholder="0" min="1" oninput="checkReady()">
        </div>
      </div>
      <div class="form-row">
        <div class="form-label">請購原因 <span class="required">*</span></div>
        <textarea class="form-textarea" id="field-reason" placeholder="說明請購原因..." oninput="checkReady()"></textarea>
      </div>
    </div>

    <!-- 維修欄位 -->
    <div class="form-card" id="repair-fields" style="display:none;">
      <div class="form-section-title">維修資訊</div>
      <div class="form-row">
        <div class="form-label">設備名稱 <span class="required">*</span></div>
        <input class="form-input" id="field-equipment" type="text" placeholder="例：1號冷氣" oninput="checkReady()">
      </div>
      <div class="form-row">
        <div class="form-label">目前狀況說明 <span class="required">*</span></div>
        <textarea class="form-textarea" id="field-situation" placeholder="描述故障或需維修的狀況..." oninput="checkReady()"></textarea>
      </div>
    </div>

    <!-- 照片 -->
    <div class="form-card">
      <div class="form-section-title">照片（選填）</div>
      <input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="handlePhotos(this)">
      <div class="photo-upload-area" id="photo-upload-area" onclick="document.getElementById('photo-input').click()">
        <div class="photo-upload-icon">📷</div>
        <div class="photo-upload-label">點擊上傳照片</div>
        <div class="photo-upload-sub">可選擇多張</div>
      </div>
      <div class="photo-preview-wrap" id="photo-preview-wrap"></div>
    </div>
  </div>

  <div class="submit-bar" id="submit-bar" style="display:none;">
    <button class="submit-btn" id="submit-btn" disabled onclick="submitForm()">送出申請</button>
  </div>
</div>

<!-- DONE -->
<div id="screen-done" class="done-screen" style="display:none;">
  <div class="done-circle">✓</div>
  <div class="done-title">申請已送出</div>
  <div class="done-sub" id="done-sub">總務將收到通知並處理</div>
  <button class="done-back-btn" onclick="resetForm()">再送一筆</button>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzuw4pafQ2asp8X5ijR9v63xZ23IwKJQnzRfoHGaiJsRs3D4P8nsNsV5hyzCia7GBMf/exec';
const CLIENT_ID = '448769511635-rpi3t0vtbqn104d2eut76aq1uqdvataq.apps.googleusercontent.com';
const DRIVE_FOLDER_ID = '1YknKvj8GKnU4JkKXoyP-w4ANMrX5q70l';

let accessToken = null;
let currentUser = null;
let formType = null;
let isUrgent = false;
let photoFiles = [];

// ── AUTH ──
function initGoogleAuth() {
  const client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/drive.file',
    callback: async (resp) => {
      if (resp.error) { showToast('登入失敗'); return; }
      accessToken = resp.access_token;
      const info = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { Authorization: 'Bearer ' + accessToken }
      }).then(r => r.json());
      currentUser = { name: info.name, email: info.email };
      document.getElementById('screen-login').style.display = 'none';
      document.getElementById('screen-form').style.display = 'block';
      document.getElementById('header-user-info').textContent = currentUser.name + '・選擇申請類型';
      document.getElementById('field-name').value = currentUser.name;
      document.getElementById('field-date').value = new Date().toISOString().split('T')[0];
      selectUrgent(false);
    },
  });
  window._tokenClient = client;
}

function requestLogin() {
  if (window._tokenClient) window._tokenClient.requestAccessToken();
}

window.addEventListener('load', () => {
  if (window.google) initGoogleAuth();
  else document.querySelector('script[src*="gsi"]').addEventListener('load', initGoogleAuth);
});

// ── TYPE SELECT ──
function selectType(type) {
  formType = type;
  document.getElementById('btn-purchase').className = 'type-btn' + (type === 'purchase' ? ' selected-purchase' : '');
  document.getElementById('btn-repair').className = 'type-btn' + (type === 'repair' ? ' selected-repair' : '');
  document.getElementById('purchase-fields').style.display = type === 'purchase' ? 'block' : 'none';
  document.getElementById('repair-fields').style.display = type === 'repair' ? 'block' : 'none';
  document.getElementById('form-body').style.display = 'block';
  document.getElementById('submit-bar').style.display = 'block';
  checkReady();
}

// ── URGENT ──
function selectUrgent(val) {
  isUrgent = val;
  document.getElementById('urgent-yes').className = 'urgent-btn' + (val ? ' selected-yes' : '');
  document.getElementById('urgent-no').className = 'urgent-btn' + (!val ? ' selected-no' : '');
}

// ── PHOTOS ──
function handlePhotos(input) {
  const files = Array.from(input.files);
  photoFiles = [...photoFiles, ...files];
  renderPhotoPreviews();
}

function removePhoto(idx) {
  photoFiles.splice(idx, 1);
  renderPhotoPreviews();
}

function renderPhotoPreviews() {
  const wrap = document.getElementById('photo-preview-wrap');
  const area = document.getElementById('photo-upload-area');
  wrap.innerHTML = photoFiles.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `<div class="photo-preview-item">
      <img class="photo-preview-img" src="${url}">
      <button class="photo-preview-remove" onclick="removePhoto(${i})">✕</button>
    </div>`;
  }).join('');
  area.className = 'photo-upload-area' + (photoFiles.length > 0 ? ' has-photo' : '');
}

// ── VALIDATE ──
function checkReady() {
  const dept = document.getElementById('field-dept').value;
  const name = document.getElementById('field-name').value.trim();
  const date = document.getElementById('field-date').value;
  let typeOk = false;
  if (formType === 'purchase') {
    const product = document.getElementById('field-product').value.trim();
    const qty = document.getElementById('field-qty').value;
    const reason = document.getElementById('field-reason').value.trim();
    typeOk = product && qty && reason;
  } else if (formType === 'repair') {
    const equip = document.getElementById('field-equipment').value.trim();
    const situation = document.getElementById('field-situation').value.trim();
    typeOk = equip && situation;
  }
  document.getElementById('submit-btn').disabled = !(dept && name && date && typeOk);
}

// ── UPLOAD PHOTO ──
async function uploadPhoto(file, fileName) {
  const metadata = { name: fileName, parents: [DRIVE_FOLDER_ID], mimeType: file.type || 'image/jpeg' };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', file);
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST', headers: { Authorization: 'Bearer ' + accessToken }, body: form,
  });
  const json = await res.json();
  if (!json.id) throw new Error('照片上傳失敗');
  await fetch('https://www.googleapis.com/drive/v3/files/' + json.id + '/permissions', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: 'reader', type: 'anyone' }),
  });
  return 'https://lh3.googleusercontent.com/d/' + json.id;
}

// ── SUBMIT ──
async function submitForm() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '上傳中...';

  try {
    const urls = [];
    for (let i = 0; i < photoFiles.length; i++) {
      showToast('上傳照片 ' + (i+1) + '/' + photoFiles.length + '...');
      const url = await uploadPhoto(photoFiles[i], '申請_' + Date.now() + '_' + i + '.jpg');
      urls.push(url);
    }

    showToast('送出申請中...');
    const payload = {
      action: 'submitRequest',
      type: formType,
      typeLabel: formType === 'purchase' ? '請購' : '維修',
      dept: document.getElementById('field-dept').value,
      name: document.getElementById('field-name').value.trim(),
      date: document.getElementById('field-date').value,
      urgent: isUrgent ? '緊急' : '一般',
      product: formType === 'purchase' ? document.getElementById('field-product').value.trim() : document.getElementById('field-equipment').value.trim(),
      spec: formType === 'purchase' ? (document.getElementById('field-spec').value.trim() || '') : '',
      qty: formType === 'purchase' ? document.getElementById('field-qty').value : '',
      reason: formType === 'purchase' ? document.getElementById('field-reason').value.trim() : document.getElementById('field-situation').value.trim(),
      photoUrls: urls,
    };

    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);

    const doneEl = document.getElementById('done-sub');
    doneEl.textContent = (formType === 'purchase' ? '請購' : '維修') + '申請已送出，總務將收到通知';
    document.getElementById('screen-form').style.display = 'none';
    document.getElementById('screen-done').style.display = 'flex';
  } catch(e) {
    showToast('送出失敗，請重試');
    btn.disabled = false;
    btn.textContent = '送出申請';
  }
}

function resetForm() {
  formType = null;
  photoFiles = [];
  isUrgent = false;
  document.getElementById('btn-purchase').className = 'type-btn';
  document.getElementById('btn-repair').className = 'type-btn';
  document.getElementById('form-body').style.display = 'none';
  document.getElementById('submit-bar').style.display = 'none';
  document.getElementById('field-product').value = '';
  document.getElementById('field-spec').value = '';
  document.getElementById('field-qty').value = '';
  document.getElementById('field-reason').value = '';
  document.getElementById('field-equipment').value = '';
  document.getElementById('field-situation').value = '';
  document.getElementById('photo-preview-wrap').innerHTML = '';
  document.getElementById('field-date').value = new Date().toISOString().split('T')[0];
  selectUrgent(false);
  document.getElementById('screen-done').style.display = 'none';
  document.getElementById('screen-form').style.display = 'block';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
